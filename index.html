<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusinessTurbo-48h.de</title>
    <style>
        :root { --cyan: #00BFFF; --silver: #C0C0C0; --bg: #1A1A1A; --text: #FFFFFF; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .hero { border: 8px solid var(--cyan); padding: 50px; border-radius: 30px; text-align: center; }
        .rocket { font-size: 80px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        h1 { color: var(--silver); text-transform: uppercase; font-size: 3rem; }
        .btn { display: inline-block; background: var(--cyan); color: white; padding: 20px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 30px; cursor: pointer; border: none; }
        .lab-section { margin-top: 50px; background: #2C3E50; padding: 30px; border-radius: 20px; }
        #data-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        input { padding: 15px; border-radius: 10px; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <div class="rocket">🚀</div>
            <h1>BUSINESS TURBO 48H</h1>
            <p>Es ist das Versprechen auf eine Begegnung der Superlative.</p>
            <button class="btn" onclick="document.getElementById('lab-section').scrollIntoView()">DABEI SEIN</button>
        </section>
        <section id="lab-section" class="lab-section">
            <h2>IT-Forensik & Data Recovery Lab</h2>
            <form id="data-form">
                <input type="text" placeholder="Dein Name" required>
                <input type="email" placeholder="E-Mail" required>
                <input type="text" placeholder="Daten-Analyse Ziel" required>
                <button type="submit" class="btn">Jetzt Daten eingeben & Sichern</button>
            </form>
        </section>
    </div>
</body>
</html>
